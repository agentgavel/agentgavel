[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgavel-adapter-langgraph"
version = "0.0.1"
description = "Unofficial AgentGavel adapter for LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGavel" }]
keywords = ["agentgavel", "adapter", "langgraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "agentgavel-adapter @ file:../../sdk/python",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/agentgavel/gavel"
Documentation = "https://github.com/agentgavel/gavel/blob/main/docs/plans/E11-langgraph-adapter.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adapters.langgraph" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
