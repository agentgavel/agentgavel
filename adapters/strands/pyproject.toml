[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgavel-adapter-strands"
version = "0.0.1"
description = "Unofficial AgentGavel adapter for AWS Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGavel" }]
keywords = ["agentgavel", "adapter", "aws-strands", "strands"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "agentgavel-adapter @ file:../../sdk/python",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/agentgavel/agentgavel"
Documentation = "https://github.com/agentgavel/agentgavel/blob/main/docs/plans/E13-v02-expansion.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adapters.strands" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../sdk/python/src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
