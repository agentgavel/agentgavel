[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgavel-adapter"
version = "0.1.0"
description = "Python adapter base for AgentGavel sidecar targets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGavel" }]
keywords = ["agentgavel", "adapter", "sidecar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentgavel/gavel"
Documentation = "https://github.com/agentgavel/gavel/blob/main/docs/design.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentgavel_adapter = ["py.typed"]
